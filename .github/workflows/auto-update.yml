name: auto-update

# Automatically track monero-project/monero releases:
#   1. resolve the newest stable vX.Y.Z.W tag
#   2. rewrite the Dockerfile pin (branch + verified commit hash)
#   3. build each arch on a NATIVE runner in parallel, push by digest
#   4. merge the digests into one multi-arch manifest (:latest/:alpine/:vX.Y.Z.W)
#
# Native runners avoid QEMU emulation for arm64, which is ~5-10x slower than
# native and previously dominated total build time.
on:
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and push even if the pin is already current (use for the first publish)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'daailouivan' }}/easy-monerod

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest monero tag and bump pin
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          chmod +x scripts/check-update.sh
          out="$(scripts/check-update.sh)" && rc=0 || rc=$?
          echo "$out"
          latest="$(echo "$out" | sed -n 's/^latest=//p')"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
          force="${{ inputs.force || false }}"
          case "$rc" in
            0) echo "updated=true"  >> "$GITHUB_OUTPUT" ;;                 # pin was bumped
            2) echo "updated=$force" >> "$GITHUB_OUTPUT" ;;                # already current
            *) echo "check-update.sh failed with rc=$rc" >&2; exit "$rc" ;;
          esac

      - name: Commit bump
        if: steps.check.outputs.updated == 'true'
        run: |
          if git diff --quiet -- Dockerfile; then
            echo "No Dockerfile change to commit."
            exit 0
          fi
          git config user.name  "daailouivan"
          git config user.email "daailouivan@users.noreply.github.com"
          git commit -am "chore: bump monero to ${{ steps.check.outputs.version }}"
          git push

  # One job per architecture, each on its own native runner, in parallel.
  # Nothing is tagged here: each job pushes a digest-only blob.
  build:
    needs: update
    if: needs.update.outputs.updated == 'true'
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm     # native arm64, free for public repos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub credentials are configured
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repo secrets before pushing." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.arch }}, native)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::build produced no valid digest: '$digest'" >&2; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into a single multi-arch manifest and tag it.
  merge:
    needs: [update, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -eu
          ls -1 | sed 's/^/  digest: sha256:/'
          [ "$(ls -1 | wc -l)" -eq 2 ] || { echo "::error::expected 2 arch digests" >&2; exit 1; }
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:alpine" \
            -t "${IMAGE}:${{ needs.update.outputs.version }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify the pushed manifest advertises both architectures
        run: |
          set -eu
          docker buildx imagetools inspect "${IMAGE}:${{ needs.update.outputs.version }}" \
            | tee /tmp/manifest.txt
          grep -q "linux/amd64" /tmp/manifest.txt || { echo "::error::amd64 missing" >&2; exit 1; }
          grep -q "linux/arm64" /tmp/manifest.txt || { echo "::error::arm64 missing" >&2; exit 1; }
          echo "Multi-arch manifest verified: amd64 + arm64"

      - name: Sync README to the Docker Hub repo description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Static monerod that auto-tracks the newest monero-project/monero release"
          readme-filepath: ./README.md
