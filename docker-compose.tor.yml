# Tor variant, following the official Monero guidance in
# https://github.com/monero-project/monero/blob/master/docs/ANONYMITY_NETWORKS.md
#
# This gives you all three official Tor capabilities, not just an onion address:
#
#   1. RPC hidden service  — wallets connect to <onion>:18089
#   2. --tx-proxy          — YOUR transactions are broadcast over Tor, so the
#                            originating IP is not exposed to peers
#   3. --anonymous-inbound — accept inbound P2P from onion peers on 18084
#
# Note the blockchain itself still syncs over clearnet IPv4: monerod does not
# support syncing over hidden services, and relies on IPv4 to make Sybil
# attacks harder. Your ISP can see you run a node; your transactions are what
# get anonymised.
#
# ---------------------------------------------------------------------------
# FIRST RUN — the onion addresses do not exist until Tor has started once.
#
#   1. docker compose -f docker-compose.tor.yml up -d tor
#   2. sleep 20 && ./scripts/tor-address.sh
#   3. Put the P2P address in ANONYMOUS_INBOUND in a .env file beside this
#      file, so monerod can advertise it to peers:
#        echo "ANONYMOUS_INBOUND=<p2p-onion>:18084,127.0.0.1:18084,25" > .env
#   4. docker compose -f docker-compose.tor.yml up -d
#
# Step 3 is optional: without it you still get the RPC onion and Tor tx
# broadcast, you just do not accept inbound onion peers.
# ---------------------------------------------------------------------------

services:
  monerod:
    image: ${MONEROD_IMAGE:-ghcr.io/daailouivan/easy-monerod:latest}
    container_name: monerod
    restart: unless-stopped
    depends_on:
      - tor
    volumes:
      - bitmonero:/home/monero/.bitmonero
    ports:
      - "18080:18080"              # clearnet p2p (sync)
      - "127.0.0.1:18089:18089"    # RPC stays on loopback; reached via onion
    command:
      - --rpc-restricted-bind-ip=0.0.0.0
      - --rpc-restricted-bind-port=18089
      # Broadcast our own transactions over Tor. 10 = max outbound onion peers.
      - --tx-proxy=tor,tor:9050,10
      # Accept inbound onion P2P on a DEDICATED port (must not be 18080).
      - --anonymous-inbound=${ANONYMOUS_INBOUND:-}
      - --no-igd
      - --no-zmq
      - --enable-dns-blocklist
      - --ban-list=/home/monero/ban_list.txt
      # - --prune-blockchain
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Plain Tor daemon driven by our own torrc, matching the official example:
  # one hidden service for RPC, one for anonymous-inbound P2P.
  tor:
    image: ghcr.io/hundehausen/tor-hidden-service:latest
    container_name: tor
    restart: unless-stopped
    volumes:
      - tor-keys:/var/lib/tor
    environment:
      # Format: HS_[NAME]=[HOST]:[PORT]:[VIRTUAL_PORT]
      # RPC onion -> monerod:18089 ; P2P onion -> monerod:18084
      - HS_MONEROD_RPC=monerod:18089:18089
      - HS_MONEROD_P2P=monerod:18084:18084

  watchtower:
    image: containrrr/watchtower:latest
    container_name: monerod-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "21600"

volumes:
  bitmonero:
  tor-keys:
