# Synology NAS.
#
#   mkdir -p bitmonero
#   chown -R 1026:100 bitmonero        # must match FIXUID/FIXGID below
#   docker compose -f docker-compose-synology.yml up -d
#
# Differences from docker-compose.yml:
#   - bind mount (./bitmonero) instead of a named volume, so the blockchain
#     lives in a Shared Folder you can browse, snapshot and back up via DSM
#   - explicit user: DSM accounts start at uid 1026 and the 'users' group is
#     gid 100; set these to match the owner of ./bitmonero
#   - a named bridge network, since DSM's default bridge is often already in use
#   - hostname pinned so peers and logs show a stable name
#
# Find your uid/gid over SSH with:  id your-dsm-username
#
# Tor is optional — every line to uncomment is marked `#T`, so:
#   grep -n '#T' this-file    lists exactly what to change.

services:
  monerod:
    image: ${MONEROD_IMAGE:-ghcr.io/daailouivan/easy-monerod:latest}
    container_name: monerod
    hostname: monerod
    restart: unless-stopped
    # Run as the DSM user that owns ./bitmonero. Override per-host:
    #   FIXUID=1027 FIXGID=100 docker compose -f docker-compose-synology.yml up -d
    user: ${FIXUID:-1026}:${FIXGID:-100}
    volumes:
      - ./bitmonero:/home/monero/.bitmonero
    ports:
      - "18080:18080"   # p2p (clearnet sync)
      - "18089:18089"   # restricted RPC  — TOR: swap for the loopback line below
      #T - "127.0.0.1:18089:18089"
    command:
      - --rpc-restricted-bind-ip=0.0.0.0
      - --rpc-restricted-bind-port=18089
      - --no-igd
      - --enable-dns-blocklist
      # Static ban list shipped in the image (PGP-verified at build time).
      # Optional: --enable-dns-blocklist above already bans dynamically.
      - --ban-list=/home/monero/ban_list.txt
      # - --no-zmq
      # - --public-node
      # - --prune-blockchain
      #
      # TOR: uncomment these two.
      #T - --tx-proxy=tor,tor:9050,10
      #T - --anonymous-inbound=${ANONYMOUS_INBOUND:-}
    networks:
      - host_bridge
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # TOR: uncomment.
    #T depends_on:
    #T   - tor

  # Optional: auto-update monerod when a new image is published.
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: monerod-watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   environment:
  #     WATCHTOWER_LABEL_ENABLE: "true"
  #     WATCHTOWER_CLEANUP: "true"
  #     WATCHTOWER_POLL_INTERVAL: "21600"

  # ==========================================================================
  # OPTIONAL: TOR
  #
  # Gives you all three capabilities from the official Monero docs
  #  (monero-project/monero docs/ANONYMITY_NETWORKS.md):
  #   1. wallets reach the node at <onion>:18089
  #   2. your own transactions broadcast over Tor  (--tx-proxy)
  #   3. accept inbound onion peers on port 18084  (--anonymous-inbound)
  #
  # An onion address ALONE does not anonymise your transactions — that is what
  # --tx-proxy does. The blockchain still syncs over clearnet IPv4; monerod
  # does not support syncing over hidden services.
  #
  #  To enable, uncomment:
  #    - this tor: service
  #    - in monerod above: the loopback RPC port (and comment the plain one),
  #     --tx-proxy, --anonymous-inbound, and depends_on
  #
  #  Then:
  #   docker compose -f docker-compose-synology.yml up -d tor
  #   sleep 20 && COMPOSE_FILE=docker-compose-synology.yml ./scripts/tor-address.sh
  #   echo "ANONYMOUS_INBOUND=<p2p-onion>:18084,127.0.0.1:18084,25" > .env
  #   docker compose -f docker-compose-synology.yml up -d
  #
  # Keys land in ./tor-keys — back that folder up to keep the same address,
  # and never share it.
  # ==========================================================================
  #
  #T tor:
  #T   image: ghcr.io/hundehausen/tor-hidden-service:latest
  #T   container_name: tor
  #T   restart: unless-stopped
  #T   volumes:
  #T     - ./tor-keys:/var/lib/tor
  #T   environment:
  #     # Format: HS_[NAME]=[HOST]:[PORT]:[VIRTUAL_PORT]
  #T     - HS_MONEROD_RPC=monerod:18089:18089
  #T     - HS_MONEROD_P2P=monerod:18084:18084
  #T   networks:
  #T     - host_bridge

networks:
  host_bridge:
    name: host_bridge
    driver: bridge
